[package]
name = "risc-v-sim-web"
version = "0.1.0"
edition = "2024"

[features]
github_authentication = []
noop_authentication = []

[lib]
name = "risc_v_sim_web"
path = "src/lib.rs"

[[bin]]
name = "risc-v-sim-web"
path = "src/main.rs"

[dependencies]
url = { version = "2.5.8", features = ["serde"] }
axum = { version = "0.8.6", features = ["multipart", "query", "macros"] }
tokio = { version = "1.48.0", features=[ "rt-multi-thread", "process", "fs", "sync", "signal", "macros" ] }
serde_json = { version = "1.0", features = ["raw_value"] }
anyhow = "1.0"
bytes = "1.10.1"
tracing = { version = "0.1.41", features = ["attributes", "log"] }
log = "0.4.17"
tracing-subscriber = "0.3.2"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
ulid = { version = "1.2.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
oauth2 = "4.4"
tower-sessions = "0.15.0"
reqwest = { version = "0.12", features = ["json"] }
rand = "0.8"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
time = { version = "0.3.47", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
sqlx = { version = "0.9", features = ["macros", "runtime-tokio", "postgres", "time"] }

[dev-dependencies]
reqwest = { version = "0.12.24", features = ["multipart", "stream", "cookies"] }
